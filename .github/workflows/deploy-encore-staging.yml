# Deploy ke Encore Cloud staging setelah merge ke master dan AI Regression lulus.
# Butuh secret: ENCORE_AUTH_KEY (sama seperti ai-regression.yml)
name: Deploy Encore Staging

on:
  workflow_run:
    workflows: ["AI Regression"]
    types: [completed]

concurrency:
  group: encore-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Install Encore CLI
        run: |
          curl -L https://encore.dev/install.sh | bash
          echo "$HOME/.encore/bin" >> "$GITHUB_PATH"

      - name: Authenticate Encore CLI
        env:
          ENCORE_AUTH_KEY: ${{ secrets.ENCORE_AUTH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ENCORE_AUTH_KEY:-}" ]; then
            echo "GitHub secret ENCORE_AUTH_KEY wajib — buat di Encore Cloud > App Settings > Auth Keys" >&2
            exit 1
          fi
          encore auth login --auth-key="$ENCORE_AUTH_KEY"

      # git-remote-encore tunnel ke git.encore.dev:22 via SSH (token auth).
      # Runner GHA belum punya host key → "Host key verification failed".
      - name: Configure SSH for Encore git
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -t rsa,ecdsa,ed25519 -H git.encore.dev >> ~/.ssh/known_hosts

      - name: Push to Encore (staging)
        run: |
          set -euo pipefail
          export PATH="$HOME/.encore/bin:$PATH"
          git remote add encore "encore://wabantu-viko-8vni"
          git push encore HEAD:master

      - name: Deploy summary
        run: |
          echo "Deploy triggered for commit ${{ github.event.workflow_run.head_sha }}"
          echo "Pantau rollout: https://app.encore.cloud/wabantu-viko-8vni"
