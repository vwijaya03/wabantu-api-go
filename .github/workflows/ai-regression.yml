name: AI Regression

on:
  pull_request:
    branches: [master]
    paths:
      - "ai/**"
      - "internal/buyerflow/**"
      - "scripts/run-ai-regression*.sh"
      - "scripts/fix-encore-test-db.sh"
      - "go.mod"
      - "go.sum"
      - "encore.app"
      - ".github/workflows/ai-regression.yml"
  push:
    branches: [master]

concurrency:
  group: ai-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate utama: golden + auto-gen + unit routing (simulator, tanpa LLM).
  # Target <10s setelah internal/buyerflow (go test) — lihat docs-development-shipped.
  regression-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Cache Encore CLI
        id: encore-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.encore/bin
            ~/.encore/cache
          key: encore-cli-${{ runner.os }}-${{ hashFiles('go.mod', 'encore.app') }}
          restore-keys: |
            encore-cli-${{ runner.os }}-

      - name: Install Encore CLI
        run: |
          set -euo pipefail
          if [[ ! -x "$HOME/.encore/bin/encore" ]]; then
            curl -L https://encore.dev/install.sh | bash
          fi
          echo "$HOME/.encore/bin" >> "$GITHUB_PATH"
          encore version

      - name: Authenticate Encore CLI
        env:
          ENCORE_AUTH_KEY: ${{ secrets.ENCORE_AUTH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ENCORE_AUTH_KEY:-}" ]; then
            echo "GitHub secret ENCORE_AUTH_KEY wajib" >&2
            exit 1
          fi
          encore telemetry disable
          encore auth login --auth-key="$ENCORE_AUTH_KEY"

      - name: Pre-pull Encore test Postgres image
        run: docker pull encoredotdev/postgres:18

      - name: Run regression (encore test — migrasi ke go test di internal/buyerflow)
        run: ./scripts/run-ai-regression-tests.sh

  # Smoke penuh paket ai (opsional, tidak blocking PR).
  regression-encore-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install Encore CLI
        run: |
          curl -L https://encore.dev/install.sh | bash
          echo "$HOME/.encore/bin" >> "$GITHUB_PATH"

      - name: Authenticate Encore CLI
        env:
          ENCORE_AUTH_KEY: ${{ secrets.ENCORE_AUTH_KEY }}
        run: encore auth login --auth-key="$ENCORE_AUTH_KEY"

      - name: Encore smoke (subset simulator tests)
        run: |
          encore test ./ai/ -run 'TestConversationRegression|TestBuyerBehaviorScriptHappyAbon' -count=1
