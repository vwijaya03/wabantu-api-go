name: Cloud Tenant DDL

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Encore environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      script:
        description: Patch script to run
        required: true
        default: all
        type: choice
        options:
          - tenant
          - inventory
          - all
      limit:
        description: Schemas per wave (used when run_all_waves is true)
        required: false
        default: "1000"
      cursor:
        description: Starting schema cursor
        required: false
        default: "0"
      run_all_waves:
        description: Loop waves until all schemas processed
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      script:
        required: false
        type: string
        default: all
      limit:
        required: false
        type: string
        default: "1000"
      cursor:
        required: false
        type: string
        default: "0"
      run_all_waves:
        required: false
        type: string
        default: "true"
    secrets:
      ENCORE_AUTH_TOKEN:
        required: true

jobs:
  cloud-ddl:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Encore CLI
        run: |
          curl -L https://encore.dev/install.sh | bash
          echo "$HOME/.encore/bin" >> "$GITHUB_PATH"

      - name: Encore auth
        env:
          ENCORE_AUTH_TOKEN: ${{ secrets.ENCORE_AUTH_TOKEN }}
        run: encore auth login --auth-key="$ENCORE_AUTH_TOKEN"

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Resolve inputs
        id: cfg
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> "$GITHUB_OUTPUT"
            echo "script=${{ github.event.inputs.script }}" >> "$GITHUB_OUTPUT"
            echo "limit=${{ github.event.inputs.limit }}" >> "$GITHUB_OUTPUT"
            echo "cursor=${{ github.event.inputs.cursor }}" >> "$GITHUB_OUTPUT"
            echo "run_all_waves=${{ github.event.inputs.run_all_waves }}" >> "$GITHUB_OUTPUT"
          else
            echo "environment=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
            echo "script=${{ inputs.script }}" >> "$GITHUB_OUTPUT"
            echo "limit=${{ inputs.limit }}" >> "$GITHUB_OUTPUT"
            echo "cursor=${{ inputs.cursor }}" >> "$GITHUB_OUTPUT"
            echo "run_all_waves=${{ inputs.run_all_waves }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply cloud tenant DDL
        run: |
          ./scripts/run-cloud-ddl-waves.sh \
            "${{ steps.cfg.outputs.environment }}" \
            "${{ steps.cfg.outputs.script }}" \
            "${{ steps.cfg.outputs.limit }}" \
            "${{ steps.cfg.outputs.cursor }}" \
            "${{ steps.cfg.outputs.run_all_waves }}"

      - name: Verify tenant migrations
        run: ./scripts/verify-tenant-migrations-cloud.sh "${{ steps.cfg.outputs.environment }}"
