name: AI Triage Fix

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: ai_triage_job UUID from Encore
        required: true
        type: string
      tenant_schema:
        description: Tenant schema (for PR body)
        required: false
        type: string
      conversation_id:
        description: Conversation UUID (for PR body)
        required: false
        type: string
      inbound_id:
        description: Inbound message UUID (for PR body)
        required: false
        type: string
      regression_code:
        description: Deprecated — workflow fetches job from Encore API
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  triage-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JOB_ID: ${{ github.event.inputs.job_id }}
      ENCORE_API_URL: ${{ secrets.ENCORE_STAGING_API_URL }}
      AI_INTERNAL_TOKEN: ${{ secrets.AI_INTERNAL_TOKEN }}
      TENANT_SCHEMA: ${{ github.event.inputs.tenant_schema }}
      CONVERSATION_ID: ${{ github.event.inputs.conversation_id }}
      INBOUND_ID: ${{ github.event.inputs.inbound_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install Encore CLI
        run: |
          curl -L https://encore.dev/install.sh | bash
          echo "$HOME/.encore/bin" >> "$GITHUB_PATH"

      - name: Authenticate Encore CLI
        env:
          ENCORE_AUTH_KEY: ${{ secrets.ENCORE_AUTH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ENCORE_AUTH_KEY:-}" ]; then
            echo "GitHub secret ENCORE_AUTH_KEY wajib — buat di Encore Cloud > App Settings > Auth Keys" >&2
            exit 1
          fi
          encore auth login --auth-key="$ENCORE_AUTH_KEY"

      - name: Fetch triage job from Encore
        run: |
          set -euo pipefail
          if [ -z "${ENCORE_API_URL:-}" ] || [ -z "${AI_INTERNAL_TOKEN:-}" ]; then
            echo "Repository secrets required: ENCORE_STAGING_API_URL, AI_INTERNAL_TOKEN" >&2
            exit 1
          fi
          curl -fsS \
            -H "X-Ai-Internal-Token: $AI_INTERNAL_TOKEN" \
            "$ENCORE_API_URL/api/v1/internal/ai-triage/jobs/$JOB_ID" \
            -o /tmp/triage_job.json
          python3 - <<'PY'
          import json, sys
          with open("/tmp/triage_job.json") as f:
              job = json.load(f).get("job") or {}
          code = (job.get("regressionCode") or "").strip()
          if not code:
              sys.exit("job.regressionCode is empty")
          with open("/tmp/regression.go", "w") as out:
              out.write(code)
          PY

      - name: Apply auto-gen regression file
        run: go run scripts/triage-apply.go --job-id "$JOB_ID" < /tmp/regression.go

      - name: Run auto-gen regression tests
        id: regression
        continue-on-error: true
        run: |
          set -o pipefail
          chmod +x scripts/run-triage-autogen-tests.sh
          ./scripts/run-triage-autogen-tests.sh 2>&1 | tee /tmp/regression.log

      - name: Parse regression failures
        if: steps.regression.outcome == 'failure'
        run: |
          python3 scripts/parse-regression-failures.py /tmp/regression.log > /tmp/regression_failures.json
          echo "Parsed failures:"
          cat /tmp/regression_failures.json

      - name: Upload mismatch report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mismatch-report-${{ env.JOB_ID }}
          path: |
            /tmp/triage_job.json
            /tmp/regression_failures.json
            /tmp/regression.log
          if-no-files-found: ignore

      - name: Create draft PR
        id: pr
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
        run: |
          set -euo pipefail
          BRANCH="fix/ai-triage-${JOB_ID:0:8}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add internal/buyerflow/regression_autogen_test.go ai/conversation_regression_auto_gen_test.go
          if git diff --cached --quiet; then
            echo "::warning::tidak ada file regression untuk di-commit (triage-apply menulis internal/buyerflow/regression_autogen_test.go)"
          else
            git commit -m "test(ai-triage): regression cases job $JOB_ID"
          fi
          git push -u origin HEAD

          if [ -n "${GITHUB_PAT:-}" ]; then
            export GH_TOKEN="$GITHUB_PAT"
          else
            export GH_TOKEN="${{ github.token }}"
          fi

          PR_URL="$(gh pr list --head "$BRANCH" --json url --jq '.[0].url // empty')"
          if [ -z "$PR_URL" ]; then
            if PR_URL=$(gh pr create --draft \
              --title "test(ai-triage): regression job ${JOB_ID:0:8}" \
              --body "## AI Triage Loop (auto)

          - Job: \`$JOB_ID\`
          - Tenant schema: \`${TENANT_SCHEMA:-}\`
          - Conversation: \`${CONVERSATION_ID:-}\`
          - Inbound: \`${INBOUND_ID:-}\`

          Regression cases di \`internal/buyerflow/regression_autogen_test.go\`.
          Routing fix: gunakan **Fix dengan AI** di konsol superadmin atau patch manual \`internal/buyerflow/\`."); then
              echo "Created draft PR: $PR_URL"
            else
              PR_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/master...${BRANCH}?expand=1"
              echo "::warning::gh pr create diblokir — buka compare URL atau set GITHUB_PAT"
            fi
          else
            echo "Existing PR: $PR_URL"
          fi
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Report completion to Encore
        if: success()
        run: |
          set -euo pipefail
          chmod +x scripts/triage-report-complete.sh
          if [ "${{ steps.regression.outcome }}" = "success" ]; then
            STATUS="pr_ready"
            ERR=""
          else
            STATUS="pr_ready_needs_fix"
            ERR="regression tests failed — lihat artifact mismatch-report"
          fi
          FAILURES_JSON="[]"
          if [ -f /tmp/regression_failures.json ]; then
            FAILURES_JSON="$(cat /tmp/regression_failures.json)"
          fi
          BODY="$(jq -n \
            --arg status "$STATUS" \
            --arg pr "${{ steps.pr.outputs.pr_url }}" \
            --arg run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --arg err "$ERR" \
            --argjson failures "$FAILURES_JSON" \
            '{status:$status, prUrl:$pr, githubRunUrl:$run, errorText:$err, regressionFailures:$failures}')"
          ./scripts/triage-report-complete.sh "$JOB_ID" "$BODY"

      - name: Report failure to Encore
        if: failure()
        run: |
          set -euo pipefail
          chmod +x scripts/triage-report-complete.sh
          BODY="$(jq -n \
            --arg status "failed" \
            --arg err "workflow failed — see Actions run" \
            --arg run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{status:$status, errorText:$err, githubRunUrl:$run}')"
          ./scripts/triage-report-complete.sh "$JOB_ID" "$BODY"
